# Fly.io: an always-on server for the backend, so the app works when the laptop is off.
# Deploy from backend/: fly deploy   (secrets from .env: see scripts/deploy-cloud.ps1)
app = "agentic-call"
primary_region = "bom"  # Mumbai

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "8000"

[mounts]
  source = "agentic_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"  # never sleeps: calls, webhooks and scheduled calls need it running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
